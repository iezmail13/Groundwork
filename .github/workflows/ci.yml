# Runs every check from CLAUDE.md on each pull request and on main:
# pgTAP against a local Supabase stack, typecheck, lint, check:labels, unit
# tests, a production build, and the Playwright smoke tests. On main, a
# passing run then deploys (deploy.yml). To redeploy by hand, run this
# workflow on main (Actions → CI → Run workflow).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # a newer push supersedes a pull request run; on main a run may be deploying,
  # so the newer run waits instead
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Checks and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Supabase (local stack in Docker)
        run: npx supabase start -x studio,imgproxy,logflare,vector,supavisor,edge-runtime,realtime

      - name: Write .env.local from the local stack
        run: npm run env:local

      - name: Database tests (pgTAP)
        run: npx supabase test db

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Terminology guard
        run: npm run check:labels

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Seed demo data
        run: npm run seed

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke tests (Playwright)
        run: npm run test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: Deploy
    needs: checks
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
