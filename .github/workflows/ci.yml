# Runs every check from CLAUDE.md on each pull request and on main:
# pgTAP against a local Supabase stack, typecheck, lint, check:labels, unit
# tests, a production build, and the Playwright smoke tests.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Supabase (local stack in Docker)
        run: npx supabase start -x studio,imgproxy,logflare,vector,supavisor,edge-runtime,realtime

      - name: Write .env.local from the local stack
        run: npm run env:local

      - name: Database tests (pgTAP)
        run: npx supabase test db

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Terminology guard
        run: npm run check:labels

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Seed demo data
        run: npm run seed

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke tests (Playwright)
        run: npm run test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
